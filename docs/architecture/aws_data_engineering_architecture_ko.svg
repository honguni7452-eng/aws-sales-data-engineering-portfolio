<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">AWS 서버리스 데이터 엔지니어링 아키텍처</title>
  <desc id="desc">Python 생성 CSV가 Amazon S3, AWS Glue ETL, 파티션 Parquet, Glue 데이터 카탈로그, Athena 엔진 v3, Apache Iceberg 실버·골드를 거쳐 포트폴리오 증빙으로 이어지는 서버리스 파이프라인입니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b7a"/>
    </marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e76f00"/>
    </marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b3fa0"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: "Malgun Gothic", "Noto Sans KR", Inter, "Segoe UI", Arial, sans-serif; fill: #16191f; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #5f6b7a; }
      .group-title { font-size: 19px; font-weight: 700; }
      .box-title { font-size: 17px; font-weight: 700; }
      .metric { font-size: 24px; font-weight: 700; }
      .body { font-size: 14px; fill: #374151; }
      .small { font-size: 12px; fill: #5f6b7a; }
      .edge-label { font-size: 12px; font-weight: 600; fill: #5f6b7a; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
      .node { filter: url(#shadow); }
    </style>
  </defs>

